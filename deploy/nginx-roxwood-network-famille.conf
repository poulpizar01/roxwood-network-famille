# Modèle de site nginx pour l'API REST du bot — voir README.md, section
# "Interopérabilité > API REST > Mise en place" pour la procédure complète
# (installation nginx/certbot, activation, vérification).
#
# À adapter avant installation :
#   - server_name : le sous-domaine public réel (ex. bot.exemple.fr) —
#     DOIT déjà pointer vers l'IP du VPS (enregistrement DNS A/AAAA) avant
#     de lancer certbot, sinon le challenge Let's Encrypt échoue.
#   - proxy_pass  : le port doit correspondre à API_PORT dans .env (3001
#     par défaut, voir .env.example).
#
# Ce fichier ne contient qu'un bloc HTTP (port 80), volontairement : lance
# `sudo certbot --nginx -d REMPLACER_bot.exemple.fr` après l'avoir activé —
# certbot détecte ce server_name, obtient le certificat Let's Encrypt, ET
# modifie CE FICHIER lui-même pour ajouter le bloc HTTPS (port 443) plus la
# redirection HTTP→HTTPS. Pas besoin d'écrire la partie TLS à la main.
server {
    listen 80;
    listen [::]:80;
    server_name REMPLACER_bot.exemple.fr;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Indispensable pour que `app.set('trust proxy', 1)` (voir
        # src/api/server.ts) fonctionne : sans ce header, l'API voit l'IP de
        # nginx sur CHAQUE requête au lieu de l'IP réelle du visiteur, et
        # express-rate-limit devient un seul compteur partagé par tout le
        # monde au lieu d'un bucket par IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
