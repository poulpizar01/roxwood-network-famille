services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roxwood_network_famille}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-roxwood_network_famille}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Expose sur l'hote pour un acces direct (prisma studio, psql...) — a
    # retirer/restreindre par pare-feu en production si le port ne doit pas
    # etre joignable depuis l'exterieur.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roxwood_network_famille} -d ${POSTGRES_DB:-roxwood_network_famille}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sans rotation, le driver json-file par defaut grossit indefiniment sur
    # le disque de l'hote — aucune limite de memoire ici : Postgres gere la
    # sienne (shared_buffers etc.), une limite arbitraire risquerait de le
    # sous-dimensionner sans connaitre le volume de donnees reel.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  roxwood-network-famille:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Ecrase le DATABASE_URL de .env (pense pour un Postgres hors conteneur,
      # via localhost) : a l'interieur du reseau docker-compose, la base est
      # joignable via le nom de service `db`, pas `localhost`.
      DATABASE_URL: postgresql://${POSTGRES_USER:-roxwood_network_famille}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-roxwood_network_famille}
    # API REST optionnelle (voir README, section Interoperabilite) : n'ecoute
    # que si API_PORT est defini dans .env, mais le port est toujours publie
    # ici (inoffensif si l'API est desactivee — rien n'ecoute dessus alors).
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    # Sans limite, une fuite memoire (ou un pic de charge inhabituel) ferait
    # tomber tout l'hote au lieu du seul conteneur. 512m est large pour un
    # bot Discord + petite API — a ajuster si des logs de crash memoire
    # apparaissent (`docker compose logs roxwood-network-famille` / `docker stats`).
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  db_data:
