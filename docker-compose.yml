services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot_famille}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-bot_famille}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Expose sur l'hote pour un acces direct (prisma studio, psql...) — a
    # retirer/restreindre par pare-feu en production si le port ne doit pas
    # etre joignable depuis l'exterieur.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot_famille} -d ${POSTGRES_DB:-bot_famille}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Ecrase le DATABASE_URL de .env (pense pour un Postgres hors conteneur,
      # via localhost) : a l'interieur du reseau docker-compose, la base est
      # joignable via le nom de service `db`, pas `localhost`.
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot_famille}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bot_famille}

volumes:
  db_data:
